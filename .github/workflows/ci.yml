name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Install Node dependencies
        run: npm ci

      - name: Build parser and run unit tests
        run: npm run build-test

      - name: Verify committed parser matches grammar.js
        run: git diff --exit-code -- src/

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Test Go binding
        run: go test ./bindings/go/

      - name: Test Node binding
        run: |
          npm install --no-save tree-sitter@^0.25.0
          npm test

      - name: Build Rust crate
        run: cargo build --release

      - name: Verify cargo package
        run: cargo package --list
